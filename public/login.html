<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-box">

    <h1>LOGIN</h1>

    <input
    type="text"
    id="username"
    placeholder="Username">

    <input
    type="password"
    id="password"
    placeholder="Password">

    <button onclick="login()">

        Login

    </button>

</div>

<script>

function login(){

    let user =
    document.getElementById("username").value;

    let pass =
    document.getElementById("password").value;

    // YOUR LOGIN

    if(

        user === "autokraft"

        &&

        pass === "7777"

    ){

        localStorage.setItem(
        "loggedIn",
        "true"
        );

        localStorage.setItem(
"loginVersion",
"2"
);

        window.location.href =
        "index.html";

    }

    else{

        alert(
        "Wrong Username or Password"
        );

    }

}

</script>

</body>
</html>
