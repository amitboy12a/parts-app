<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>GearFlow Auto Parts</title>

    <link
    rel="stylesheet"
    href="style.css">

</head>

<body>

    <div class="container">

        <div class="title">
            GEARFLOW AUTO PARTS
        </div>

        <div class="search-box">

            <input
            type="text"
            id="search"
            placeholder="Search Part Number...">

            <button onclick="searchProduct()">
                🔍
            </button>

        </div>

        <div class="main">

            <!-- PRODUCTS -->

            <div
            class="products"
            id="products">

            </div>

            <!-- CART -->

            <div class="cart">

                <h2>
                    Cart Summary
                </h2>

                <div id="cart">

                </div>

                <div id="total">
                    Total Amount: Rs. 0
                </div>

                <button
                class="download-btn"
                onclick="downloadPDF()">

                    Download Bill PDF

                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
