<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
    name="viewport"

<body>

</div>

    <div class="container">

       

        <div class="search-box">

    </div>

</div>

        <div class="main">

                <h2>

                </h2>

                <div id="cart">

                </div>

        </div>
